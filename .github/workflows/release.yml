name: Build and publish reviewed installers
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release.yml']
  workflow_dispatch:
permissions: {}
jobs:
  kits:
    runs-on: ubuntu-24.04
    permissions: {contents: read, id-token: write, attestations: write}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Build and inspect Windows installer and source kits
        run: |
          set -euo pipefail
          python3 packaging/verify.py kits
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nsis
          makensis -V3 windows-setup.nsi
          curl --fail --silent --show-error --location https://www.7-zip.org/a/7z2501-linux-x64.tar.xz -o "$RUNNER_TEMP/7z.tar.xz"
          echo "4ca3b7c6f2f67866b92622818b58233dc70367be2f36b498eb0bdeaaa44b53f4  $RUNNER_TEMP/7z.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/7z.tar.xz" -C "$RUNNER_TEMP" 7zz
          "$RUNNER_TEMP/7zz" x -y -o"$RUNNER_TEMP/payload" HarnessMiku-Windows-x64-Setup.exe
          python3 packaging/verify.py exe "$RUNNER_TEMP/payload"
          mv HarnessMiku-Windows-x64-Setup.exe release/
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with: {subject-path: release/HarnessMiku-Windows-x64-Setup.exe}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: reviewed-kits, path: release/, if-no-files-found: error}
  mac:
    needs: kits
    runs-on: macos-15
    permissions: {contents: read, actions: read, id-token: write, attestations: write}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Build and inspect macOS installer disk image
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          set -eu
          gh run download "$GITHUB_RUN_ID" -n reviewed-kits -D input
          bash packaging/build-mac.sh input/HarnessMiku-Mac.zip "$PWD/HarnessMiku-Mac.dmg"
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with: {subject-path: HarnessMiku-Mac.dmg}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: reviewed-dmg, path: HarnessMiku-Mac.dmg}
  ios:
    runs-on: macos-26
    permissions: {contents: read, id-token: write, attestations: write}
    outputs:
      available: ${{ steps.sdk.outputs.available }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - id: sdk
        name: Locate the required iOS 27.2 SDK
        run: |
          for dev in /Applications/Xcode*.app/Contents/Developer; do
            version=$(DEVELOPER_DIR="$dev" xcrun --sdk iphoneos --show-sdk-version 2>/dev/null) || continue
            case "$version" in 27.2|27.2.*)
              echo "DEVELOPER_DIR=$dev" >> "$GITHUB_ENV"
              echo "available=true" >> "$GITHUB_OUTPUT"
              exit 0;;
            esac
          done
          echo "available=false" >> "$GITHUB_OUTPUT"
          echo "::warning::Required iOS 27.2 SDK unavailable on this runner."
      - if: steps.sdk.outputs.available == 'true'
        run: bash packaging/build-ios.sh "$PWD/HarnessMiku-iOS.ipa"
      - if: steps.sdk.outputs.available == 'true'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with: {subject-path: HarnessMiku-iOS.ipa}
      - if: steps.sdk.outputs.available == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: reviewed-ipa, path: HarnessMiku-iOS.ipa, if-no-files-found: error}
  publish:
    needs: [kits, mac, ios]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions: {actions: read, contents: write, attestations: read}
    env: {GH_TOKEN: "${{ github.token }}", GH_REPO: "${{ github.repository }}"}
    steps:
      - name: Verify provenance and publish
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" -n reviewed-kits -D release
          gh run download "$GITHUB_RUN_ID" -n reviewed-dmg -D release
          if [[ "${{ needs.ios.outputs.available }}" == true ]]; then
            gh run download "$GITHUB_RUN_ID" -n reviewed-ipa -D release
          fi
          cd release
          shopt -s nullglob
          for file in *.exe *.dmg *.ipa; do gh attestation verify "$file" -R "$GH_REPO" --signer-workflow "$GH_REPO/.github/workflows/release.yml"; done
          sha256sum *.exe *.dmg *.ipa *.zip > SHA256SUMS.txt
          cat > ../notes <<EOF
          Windows x64는 EXE, Apple Silicon Mac은 DMG를 열고 제작자 원본 ZIP을 선택하세요. ZIP 설치 키트와 소스도 함께 제공합니다.

          iOS 0.1.1 (25)는 처음 실행할 때 파일 앱에서 캐릭터 ZIP을 가져옵니다. 로그인 또는 API 키로 대화하며, 기기 내 언어 모델은 사용하지 않습니다.

          [설치 및 첫 실행 안내](https://github.com/$GH_REPO/blob/v0.1.1/README.md)
          EOF
          if [[ -f HarnessMiku-iOS.ipa ]]; then
            echo 'iOS IPA는 개인 서명 정보가 없는 기기용 빌드입니다.' >> ../notes
          else
            echo '이 릴리즈의 iOS는 소스만 제공됩니다. 빌드 러너에 iOS 27.2 SDK가 없어 IPA를 생성하지 못했습니다.' >> ../notes
          fi
          gh release create v0.1.1 ./* --target "$GITHUB_SHA" --title 'Harness Miku v0.1.1' --notes-file ../notes
