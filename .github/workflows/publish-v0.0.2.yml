name: Publish v0.0.2 installer kits
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v0.0.2.yml']
  workflow_dispatch:
permissions: {}
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v0.0.2
      BUILD_SHA: 28e3d33333011d83a023dc5d2fda3546e47c63dc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify existing Windows build and assemble platform kits
        run: |
          set -euo pipefail
          git diff --exit-code "$BUILD_SHA" HEAD -- . ':!README.md' ':!.github/workflows/publish-v0.0.2.yml'
          mkdir release
          gh run download 41631409958 --repo "$GITHUB_REPOSITORY" --name "HarnessMiku-Windows-$BUILD_SHA" --dir release
          (cd release && sha256sum -c SHA256SUMS.txt)
          gh attestation verify release/HarnessMiku-Windows-x64-Setup.exe --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/windows-installer.yml"
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          for platform in ('Mac', 'Windows-x64'):
              with zipfile.ZipFile(f'dist/HarnessMiku-{platform}-v29.zip') as previous, zipfile.ZipFile(f'release/HarnessMiku-{platform}.zip', 'w', zipfile.ZIP_DEFLATED) as updated:
                  for name in previous.namelist():
                      path = Path(name).relative_to('HarnessMiku')
                      updated.write(path, name)
          PY
          cd release
          sha256sum *.exe *.zip > SHA256SUMS.txt
      - name: Publish installers, sources and checksums
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          ## 설치 파일
          
          | Windows x64 | macOS Apple Silicon | 소스와 검증 |
          | --- | --- | --- |
          | [원클릭 설치기](https://github.com/pbomaster/HarnessMiku/releases/download/v0.0.2/HarnessMiku-Windows-x64-Setup.exe) · [ZIP 키트](https://github.com/pbomaster/HarnessMiku/releases/download/v0.0.2/HarnessMiku-Windows-x64.zip) | [Mac 설치 키트](https://github.com/pbomaster/HarnessMiku/releases/download/v0.0.2/HarnessMiku-Mac.zip) | [Windows 빌드 원본 소스](https://github.com/pbomaster/HarnessMiku/releases/download/v0.0.2/HarnessMiku-source.zip) · [SHA-256 목록](https://github.com/pbomaster/HarnessMiku/releases/download/v0.0.2/SHA256SUMS.txt) |
          
          1. [제작자의 Ko-fi](https://ko-fi.com/s/7bb9ac0243)에서 Live2D 모델 ZIP을 받으세요. 모델은 설치 키트에 포함되지 않습니다.
          2. **Windows**에서는 모델 ZIP을 EXE 옆에 두고 EXE를 실행하거나 파일 선택 창에서 지정하세요. 설치기는 공식 하네스에 포함된 Python을 사용하며 Git을 따로 설치할 필요가 없습니다.
          3. **Mac**에서는 설치 키트의 압축을 풀고 모델 ZIP을 옆에 둔 뒤 `Install.command`를 실행하세요. 앱은 `~/Applications/Harness Miku.app`에 설치됩니다.
          
          [설치 후 계정·API·로컬 모델 설정](https://github.com/pbomaster/HarnessMiku/blob/v0.0.2/README.md#설치-후-설정) · [공개 Windows 빌드 기록](https://github.com/pbomaster/HarnessMiku/actions/runs/41631409958)
          
          Windows EXE에는 GitHub 빌드 출처 증명이 있으며 Authenticode 게시자 서명은 없습니다. 검증 명령은 `gh attestation verify HarnessMiku-Windows-x64-Setup.exe -R pbomaster/HarnessMiku`입니다.
          
          ## SHA-256
          NOTES
          printf '\n```text\n' >> notes.md
          cat release/SHA256SUMS.txt >> notes.md
          printf '```\n' >> notes.md
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Harness Miku v0.0.2 · Windows & macOS" --notes-file notes.md
