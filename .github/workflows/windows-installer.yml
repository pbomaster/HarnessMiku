name: Build Windows installer
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compile the Windows installer from this checkout
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nsis
          makensis -VERSION
          makensis -V3 windows-setup.nsi
          mkdir -p build
          mv HarnessMiku-Windows-x64-Setup.exe build/
          file build/HarnessMiku-Windows-x64-Setup.exe | grep 'PE32 executable'
          git archive --format=zip --output=build/HarnessMiku-source.zip HEAD -- . ':!dist'
          cd build
          sha256sum HarnessMiku-Windows-x64-Setup.exe HarnessMiku-source.zip | tee SHA256SUMS.txt
      - name: Attest the installer build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: build/HarnessMiku-Windows-x64-Setup.exe
      - name: Upload installer, source and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: HarnessMiku-Windows-${{ github.sha }}
          path: build/
          if-no-files-found: error
